<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · The Koi Pond</title>
    <!-- GitHub shows this page at any address that doesn't exist, so every
         link and file below starts from the top of the site (/...). -->
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/deki.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#faf6f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141b1b" media="(prefers-color-scheme: dark)" />
    <style>
      :root {
        --bg: #faf6f1;
        --text: #2b2420;
        --muted: #7a6d64;
        --accent: #b4532a;
        color-scheme: light;
      }

      /* Dark mode is "pond at night" (branding/BRAND.md). */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141b1b;
          --text: #f1ebe5;
          --muted: #a89a8f;
          --accent: #e07a4f;
          color-scheme: dark;
        }
      }

      @font-face {
        font-family: "Pond Pebbles";
        src: url("/font/PondPebbles.woff2") format("woff2");
        font-display: swap;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 64px 16px;
        text-align: center;
      }

      .ben {
        width: 160px;
        height: auto;
      }

      h1 {
        margin: 16px 0 8px;
        font: 400 2.6rem/1.1 "Pond Pebbles", system-ui, sans-serif;
      }

      p {
        margin: 0 auto 24px;
        max-width: 28em;
        color: var(--muted);
        text-wrap: balance;
      }

      a {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="ben" src="/ben-scream.svg" alt="" width="160" height="112" />
      <h1>This page isn't here</h1>
      <p>Ben has looked everywhere, and he's taking it about as well as you'd expect. The link may be old, or mistyped.</p>
      <a href="/">Back to The Koi Pond</a>
    </main>
  </body>
</html>
